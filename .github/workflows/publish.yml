name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish # must match the Trusted Publisher config on npmjs.com
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24 # bundles npm >= 11.5.1, required for OIDC
          registry-url: https://registry.npmjs.org

      - name: Verify package contents
        run: npm pack --dry-run

      # No token needed: npm exchanges the GitHub OIDC token automatically
      # once this repo + workflow file is configured as a Trusted Publisher
      # on npmjs.com. Provenance attestation is generated automatically.
      - name: Publish
        run: npm publish --access public
